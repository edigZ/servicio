name: CI/CD Prod Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push-prod:
    runs-on: ubuntu-latest

    steps:
      # Clonar el repo
      - uses: actions/checkout@v3

      # Configurar Java 17
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Construir con Maven desde la carpeta del proyecto 'servicio'
      - name: Build with Maven
        working-directory: ./servicio
        run: mvn clean package -DskipTests

      # Login a Docker Hub con secrets configurados
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir imagen Docker a Docker Hub con tag prod/latest
      - name: Build & Push Docker image (prod)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: edigz/servicio:prod
