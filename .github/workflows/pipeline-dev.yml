name: Pipeline-Dev

on:
  push:
    branches:
      - desarrollo

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest

    steps:
      # Clonar el repo completo
      - uses: actions/checkout@v3

      # Configurar Java 17
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Ejecutar Maven build en la raíz (sin working-directory)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Login a Docker Hub (usa tus secrets)
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir imagen docker con contexto raíz
      - name: Build & Push Docker image (dev)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: edigz/msoservicios:dev
